<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sistem Mutu, Akreditasi &amp; PKKS — SMP IT AN NABA BOGOR</title>
  <meta name="description" content="Sistem Manajemen Mutu, Akreditasi (IASP 2024 &amp; Rapor Pendidikan) dan PKKS Tahunan SMP IT AN NABA BOGOR." />
  <meta name="theme-color" content="#2E5A44" />

  <!-- Logo lembaga: ikon tab, ikon layar utama ponsel, dan gambar pratinjau saat link dibagikan (WhatsApp, dll.) -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/3YB07TBf/LOGO-SMP-IT-AN-NABA-BOGOR.png" />
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/3YB07TBf/LOGO-SMP-IT-AN-NABA-BOGOR.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sistem Mutu, Akreditasi &amp; PKKS — SMP IT AN NABA BOGOR" />
  <meta property="og:description" content="Akreditasi, Rapor Pendidikan, supervisi, RKAS, dan PKKS tahunan dalam satu aplikasi." />
  <meta property="og:image" content="https://i.ibb.co.com/3YB07TBf/LOGO-SMP-IT-AN-NABA-BOGOR.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F7F6F2; /* sama dengan latar aplikasi */
      overflow: hidden;          /* mencegah scroll ganda */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;   /* cadangan untuk peramban lama */
      height: 100dvh;  /* pas di peramban seluler */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Layar pembuka selama aplikasi dimuat */
    #splash {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #F7F6F2;
      color: #1C1B18;
      text-align: center;
      transition: opacity .35s ease;
      z-index: 2;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 88px; height: 88px; object-fit: contain; }
    #splash h1 { font-size: 17px; margin: 14px 0 4px; letter-spacing: .01em; }
    #splash p { font-size: 13px; color: #6B675E; margin: 0; }
    #splash .bar { width: 160px; height: 3px; border-radius: 3px; background: #EDEBE4; margin: 18px auto 0; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #D94E1F; border-radius: 3px; animation: jalan 1.1s ease-in-out infinite; }
    @keyframes jalan { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #splash .lambat { display: none; margin-top: 16px; font-size: 13px; }
    #splash .lambat a { color: #2E5A44; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div id="splash" role="status" aria-live="polite">
      <div>
        <img src="https://i.ibb.co.com/3YB07TBf/LOGO-SMP-IT-AN-NABA-BOGOR.png" alt="Logo SMP IT AN NABA BOGOR" />
        <h1>SMP IT AN NABA BOGOR</h1>
        <p>Menyiapkan Sistem Mutu &amp; PKKS…</p>
        <div class="bar" aria-hidden="true"></div>
        <div class="lambat" id="lambat">
          Pemuatan lebih lama dari biasanya.<br />
          <a href="https://script.google.com/macros/s/AKfycby4oibiEk3mknajLjkAhFnxPRjKDNrQujCJoB_VY87QGET3WA1RMUyITOUezDfAclW5/exec" target="_blank" rel="noopener">Buka aplikasi di tab baru</a>
        </div>
      </div>
    </div>

    <iframe
      id="app"
      title="Sistem Mutu, Akreditasi & PKKS — SMP IT AN NABA BOGOR"
      src="https://script.google.com/macros/s/AKfycby4oibiEk3mknajLjkAhFnxPRjKDNrQujCJoB_VY87QGET3WA1RMUyITOUezDfAclW5/exec"
      allow="fullscreen; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // Sembunyikan layar pembuka setelah aplikasi termuat; tawarkan tab baru bila lebih dari 15 detik.
    (function () {
      var splash = document.getElementById('splash');
      var lambat = setTimeout(function () { document.getElementById('lambat').style.display = 'block'; }, 15000);
      document.getElementById('app').addEventListener('load', function () {
        clearTimeout(lambat);
        splash.classList.add('hide');
        setTimeout(function () { splash.style.display = 'none'; }, 400);
      });
    })();
  </script>
</body>
</html>
